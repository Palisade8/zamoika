<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZA Мойка — Панель менеджера</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
    <header>
        <h1>🚿 ZA Мойка — Панель менеджера</h1>
        <div id="user-info"></div>
    </header>

    <nav>
        <ul>
            <li><a href="#" onclick="showSection('schedule')">Расписание</a></li>
            <li><a href="#" onclick="showSection('invoices')">Счета</a></li>
            <li><a href="#" onclick="showSection('services')">Услуги</a></li>
            <li><a href="#" onclick="showSection('reports')">Отчёты</a></li>
            <li><a href="#" onclick="showSection('settings')">Настройки</a></li>
        </ul>
    </nav>

    <main>
        <section id="schedule" class="section active">
            <h2>Расписание</h2>
            <div id="calendar"></div>
            <div id="time-slots"></div>
        </section>

        <section id="invoices" class="section">
            <h2>Счета</h2>
            <div id="invoices-list"></div>
        </section>

        <section id="services" class="section">
            <h2>Услуги и товары</h2>
            <div id="services-list"></div>
        </section>

        <section id="reports" class="section">
            <h2>Отчёты</h2>
            <button onclick="generateReport()">Сформировать отчёт</button>
            <div id="report-result"></div>
        </section>

        <section id="settings" class="section">
            <h2>Настройки</h2>
            <div id="settings-panel"></div>
        </section>
    </main>

    <script src="auth.js"></script>
    <script src="calendar.js"></script>
    <script src="schedule.js"></script>
    <script src="invoices.js"></script>
    <script src="services.js"></script>
    <script src="report.js"></script>
    <script src="settings.js"></script>
    <script src="lifepay.js"></script>
    <script src="main.js"></script>
</body>
</html>
